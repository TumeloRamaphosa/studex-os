# Studex Deploy Guard — runs on every PR and on main.
# Blocks merges that leak secrets or break lint/tests/build. All tools are free and open source.
name: Deploy Guard

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks git --redact --no-banner --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            gitleaks dir . --redact --no-banner
          fi

  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    if: ${{ hashFiles('**/*.py') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest pip-audit
      - run: if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: ruff (errors only until the repo is cleaned up)
        run: ruff check . --select E9,F63,F7,F82 --output-format=github
      - name: tests
        run: |
          if find . -name "test_*.py" -not -path "./.venv/*" -not -path "./node_modules/*" | grep -q .; then
            python -m pytest -q
          else
            echo "No Python tests found — add some."
          fi
      - name: dependency audit
        run: if [ -f requirements.txt ]; then pip-audit -r requirements.txt --strict || echo "::warning::pip-audit found issues"; fi

  node:
    name: Node lint + tests + build
    runs-on: ubuntu-latest
    if: ${{ hashFiles('package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile; R=pnpm
          elif [ -f package-lock.json ]; then npm ci; R=npm
          elif [ -f yarn.lock ]; then corepack enable && yarn install --frozen-lockfile; R=yarn
          else npm install; R=npm; fi
          echo "R=$R" >> "$GITHUB_ENV"
      - name: lint / test / build (whichever scripts exist)
        run: |
          for s in lint typecheck test build; do
            if node -e "process.exit(require('./package.json').scripts?.['$s']?0:1)"; then
              echo "::group::$s"; $R run $s; echo "::endgroup::"
            fi
          done

  shell:
    name: Shell + JSON checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (errors only)
        run: |
          files=$(git ls-files '*.sh')
          if [ -n "$files" ]; then shellcheck -S error $files; else echo "no shell scripts"; fi
      - name: JSON validity
        run: |
          for f in $(git ls-files '*.json' | grep -v -E 'package-lock|tsconfig'); do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }
          done
