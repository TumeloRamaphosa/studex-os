version: "3"
services:
  web-terminal:
    image: node:22-alpine
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /:/host-root:ro
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webterm.rule=Host(`terminal.studex-group.com`)"
      - "traefik.http.routers.webterm.tls=true"
