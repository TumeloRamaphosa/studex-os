name: dev-owner
version: "1.0"
description: >
  Primary development agent — writes and owns code across the StudeX OS codebase.
  Driven by LangChain connector via OpenRig MCP tools (rig_send, rig_capture).
  Coordinates with dev-naledi (write/creative) and dev-kev (quality gate).

defaults:
  runtime: claude-code

profiles:
  default:
    uses:
      skills: [development-team, test-driven-development, systematic-debugging, verification-before-completion]
      guidance: []
      subagents: []
      plugins: []
      runtime_resources: [openrig-core]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
