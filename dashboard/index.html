<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudEx Nexus — Command Deck</title>
<style>
:root{
  --bg:#0A0A0A; --panel:#121212; --gold:#C9A84C; --gold-dim:#8a7233;
  --text:#EDE8DC; --muted:#9a927f; --green:#3ddc84; --amber:#f0b429; --red:#ff5b5b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:28px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
h1{font-size:22px;letter-spacing:2px;font-weight:600;color:var(--gold)}
h1 span{color:var(--text);font-weight:400}
.sub{color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:24px}
.badge{background:var(--gold);color:#0A0A0A;font-weight:700;padding:4px 12px;border-radius:20px;font-size:12px;letter-spacing:1px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid #222;border-radius:10px;padding:16px}
.stat .num{font-size:32px;font-weight:700;color:var(--gold)}
.stat .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid #222;border-radius:10px;padding:18px;transition:border-color .2s}
.card:hover{border-color:var(--gold-dim)}
.card .name{font-size:16px;font-weight:700;letter-spacing:1px}
.card .seat{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin:4px 0 10px}
.card .role{color:var(--muted);font-size:12px;line-height:1.5;min-height:36px;margin-bottom:12px}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.online{background:rgba(61,220,132,.15);color:var(--green)}
.pending{background:rgba(240,180,41,.15);color:var(--amber)}
.offline{background:rgba(255,91,91,.15);color:var(--red)}
.meta{color:var(--muted);font-size:10px;margin-top:10px;display:flex;gap:10px;flex-wrap:wrap}
footer{color:var(--muted);font-size:11px;margin-top:28px;text-align:center;letter-spacing:1px}
</style>
</head>
<body>
<header><h1>STUDEX <span>NEXUS</span></h1><div class="badge">COMMAND DECK</div></header>
<div class="sub">Sovereign AI Operating System · 16-Seat Force · Monitored by Nexus Command Deck</div>
<div class="stats">
  <div class="stat"><div class="num" id="sTotal">—</div><div class="lbl">Total Seats</div></div>
  <div class="stat"><div class="num" id="sOnline" style="color:var(--green)">—</div><div class="lbl">Online</div></div>
  <div class="stat"><div class="num" id="sPending" style="color:var(--amber)">—</div><div class="lbl">Awaiting Command</div></div>
  <div class="stat"><div class="num" id="sOffline" style="color:var(--red)">—</div><div class="lbl">Offline</div></div>
</div>
<div class="grid" id="grid"></div>
<footer>seats.json registry · Owner: Tumelo Ramaphosa (Agent Lord) · 2026 · <a href="assembly.html" style="color:#C9A84C">Assembly Floor</a></footer>
<script>
async function load(){
  let seats = {};
  try{
    const r = await fetch('seats.json', {cache:'no-store'});
    seats = (await r.json()).seats || {};
  }catch(e){ console.warn('fetch failed, using empty'); }
  const grid = document.getElementById('grid');
  const entries = Object.entries(seats);
  let online=0, pending=0, offline=0;
  grid.innerHTML = '';
  entries.forEach(([slug, s]) => {
    const st = (s.status||'').toLowerCase();
    if(st==='online') online++; else if(st==='offline') offline++; else pending++;
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML = `
      <div class="name">${s.name||slug}</div>
      <div class="seat">${s.seat||''}</div>
      <div class="role">${s.role||''}</div>
      <span class="pill ${st}">${s.status||'pending'}</span>
      <div class="meta">
        <span>${s.model||'—'}</span>
        <span>${s.clearance||''}</span>
      </div>`;
    grid.appendChild(card);
  });
  document.getElementById('sTotal').textContent = entries.length;
  document.getElementById('sOnline').textContent = online;
  document.getElementById('sPending').textContent = pending;
  document.getElementById('sOffline').textContent = offline;
}
load();
</script>
</body>
</html>
